site_name: KidCe FPV
site_description: FPV racing, builds, repairs and notes by KidCe
site_author: Nikos Kitsikoudis
site_url: https://kidce.github.io/
repo_url: https://github.com/KidCe/KidCe.github.io
repo_name: KidCe/KidCe.github.io

theme:
  name: material
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: fpv-light
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

plugins:
  - search:
      lang: en
  - blog:
      blog_dir: articles
      post_dir: articles/posts
      archive: true
      archive_name: Archive
      categories: true
      categories_name: Topics
      pagination_per_page: 6
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      zoomable: true
      draggable: true
      auto_caption: true
      caption_position: bottom
      skip_classes:
        - no-lightbox
  - rss:
      match_path: articles/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
  - social:
      enabled: !ENV [ CI, false ]
      cards_layout: default
      cards_layout_options:
        background_color: "#15171b"
        color: "#ffffff"

