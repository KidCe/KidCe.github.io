site_name: KidCe FPV
site_description: FPV racing, builds, repairs and notes by KidCe
site_author: Nikos Kitsikoudis
site_url: https://kidce.github.io/
repo_url: https://github.com/KidCe/KidCe.github.io
repo_name: KidCe/KidCe.github.io

theme:
  name: material
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: fpv-light
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

plugins:
  - search:
      lang: en
  - blog:
      blog_dir: articles
      post_dir: articles/posts
      archive: true
      archive_name: Archive
      categories: true
      categories_name: Topics
      pagination_per_page: 6
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      zoomable: true
      draggable: true
      auto_caption: true
      caption_position: bottom
      skip_classes:
        - no-lightbox
  - rss:
      match_path: articles/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
  - social:
      enabled: !ENV [ CI, false ]
      cards_layout: default
      cards_layout_options:
        background_color: "#15171b"
        color: "#ffffff"

exclude_docs: |
  builds/analog-build.md
  builds/dji-o4-build.md
  wiki/repairs/happymodel-2g4.md
  **/AGENTS.md
  projects/3D Printing/Flashforge Creator 5/Root/**
  projects/3D Printing/Flashforge Creator 5/Knowledge Base/Sources/**
  projects/3D Printing/Flashforge Creator 5/Knowledge Base/Architecture/Single Points of Truth.md

hooks:
  - hooks/all_articles.py

nav:
  - Home: index.md
  - All Articles: all-articles.md
  - Articles:
      - articles/index.md
  - Builds:
      - Overview: builds/index.md
      - Budget Build: builds/budget-build.md
      - 2026 Racing Setup: builds/2026-racing-setup.md
  - Projects:
      - Overview: projects/index.md
      - Addressable Balancer LEDs: projects/addressable-balancer-leds.md
      - Tinywhoop LED Gate: projects/tinywhoop-led-gate.md
      - 3.5-inch 1S Endurance Drone: projects/35-inch-1s-endurance-drone.md
      - 3D Printing:
          - Flashforge Creator 5:
              - Overview: projects/3D Printing/Flashforge Creator 5/Flashforge Creator 5.md
              - Knowledge base: projects/3D Printing/Flashforge Creator 5/Knowledge Base/00 Index - Flashforge Creator 5.md
              - Setup & modifications:
                  - Modding baseline: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Guides/Modding Baseline - Root Loop and Mainsail.md
                  - Optional modifications: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Guides/Optional Mod Matrix.md
                  - Camera & remote screen: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Guides/Camera and Remote Screen.md
                  - Entware, Moonraker & Mainsail: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Guides/Entware Moonraker and Mainsail Updates.md
                  - Print workflow & OrcaSlicer: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Guides/Print Workflow Adaptive Mesh and OrcaSlicer.md
                  - Heat & fan routing: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Guides/Heat and Fan Routing.md
                  - SSH host keys: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Guides/SSH Host Key Persistence.md
              - Recovery:
                  - Start here: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Recovery/Recovery Overview.md
                  - Device evidence & partition layout: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Recovery/Device Evidence and Partition Layout.md
                  - Read-only USBCloner acquisition: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Recovery/USBCloner Read-only Acquisition.md
                  - Offline repair & validation: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Recovery/Offline Repair and Validation.md
                  - Temporary ADB access: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Recovery/Temporary ADB Access.md
              - Architecture & firmware:
                  - Stock & target architecture: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Architecture/Stock and Target Architecture.md
                  - Vendor firmware & Klipper: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Firmware/Vendor Firmware and Klipper.md
                  - Open firmware migration: projects/3D Printing/Flashforge Creator 5/Knowledge Base/Firmware/Open Firmware Migration.md
  - Wiki:
      - Overview: wiki/index.md
      - Fundamentals:
          - Capacitor for FPV Racing: wiki/fundamentals/capacitor-for-fpv-racing.md
      - Equipment & field setup:
          - FPV gate padding: wiki/equipment/fpv-gate-padding.md
      - Repairs:
          - IP2368 USB-C PD reset: wiki/repairs/ip2368-usb-c-pd-reset.md
  - About:
      - About me: about-me.md
      - Race results: race-results.md
      - My Squad - Holy*s*quad: my-squad.md
  - Web Tools:
      - Index: Web Tools/index.md
      - NKON Cell Selector: tools/cell-selector.md
      - Betaflight RX Monitor: Web Tools/Betaflight RX Monitor.md
      - KAACK Cloud Build: Web Tools/KAACK Cloud Build.md
      - KidCe Configurator: Web Tools/KidCe Configurator.md
      - RatesManager: Web Tools/RatesManager.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji ""
      emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ""
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
  - assets/cell-selector/style.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js
  - assets/javascripts/race-performance-chart.js
  - assets/cell-selector/app.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KidCe
      name: KidCe on GitHub
    - icon: fontawesome/solid/rss
      link: https://kidce.github.io/feed_rss_created.xml
      name: Subscribe to new articles
  generator: false

copyright: © 2026 KidCe · Built with MkDocs Material


